    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      return { id(liw01_hw).get_service_state_text() };


number:
  # Persistent display scaling. Default 1.0 preserves the field-proven LIW-01
  # behavior 1 accepted HC590 pulse = 1 liter. Stored in ESPHome preferences;
  # never changes golden counter/FRAM math.
  - platform: template
    name: "Impulses per liter"
    web_server:
      sorting_group_id: web_group_service
      sorting_weight: 25
    id: liw01_impulses_per_liter
    entity_category: config
    icon: "mdi:pulse"
    min_value: 0.001
    max_value: 10000
    step: 0.001
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1.0

  # Two-step service calibration. Editing this number alone changes nothing; the
  # separate APPLY button below performs the atomic SET TOTAL transaction. The
  # 10,000,000 L limit keeps every integer exactly representable by ESP8266 float.
  - platform: template
    name: "Service target total liters"
    web_server:
      sorting_group_id: web_group_service
      sorting_weight: 30
    id: liw01_service_target_total
    entity_category: config
    min_value: 0
    max_value: 10000000
    step: 1
    mode: box
    optimistic: true
    restore_value: false
    initial_value: 0

button:
  # V0.3.0 adds explicit service SET/RESET controls. They call one C++ transaction
  # primitive, never clear HC590, and never touch original FRAM 0x000..0x035.
  - platform: template
    name: "APPLY Service SET TOTAL"
    id: liw01_apply_set_total_button
    web_server:
      sorting_group_id: web_group_service
      sorting_weight: 40
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: |-
          const float requested_f = id(liw01_service_target_total).state;
          if (isnan(requested_f) || requested_f < 0.0f) {
            ESP_LOGE("liw01_service", "SET TOTAL refused: invalid target number");
            return;
          }
          const uint64_t requested_l = static_cast<uint64_t>(requested_f + 0.5f);
          id(liw01_hw).service_set_total_liters(requested_l);

  - platform: template
    name: "RESET COUNTER TO 0 - SERVICE"
    id: liw01_reset_counter_button
    web_server:
      sorting_group_id: web_group_service
      sorting_weight: 60
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: |-
          if (!id(liw01_reset_arm).state) {
            ESP_LOGW("liw01_web_guard", "RESET COUNTER refused: ARM switch is OFF");
            return;
          }
          // Consume the arm BEFORE calling the destructive transaction.
          id(liw01_reset_arm).turn_off();
          id(liw01_hw).service_reset_counter();

  - platform: template
    name: "FRAM FULL SNAPSHOT READ ONLY"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(liw01_hw).dump_full_fram_readonly();

  # Raw ESPHome preference erase is internal; only the guarded wrapper is exposed.
  - platform: factory_reset
    id: liw01_factory_reset_internal
    internal: true

  - platform: template
    name: "RESET LOCAL CONFIG - KEEP TOTAL"
    id: liw01_local_config_reset_button
    web_server:
      sorting_group_id: web_group_service
      sorting_weight: 80
    entity_category: config
    disabled_by_default: true
    on_press:
      - if:
          condition:
            switch.is_on: liw01_local_config_reset_arm
          then:
            # Consume ARM before the destructive action.
            - switch.turn_off: liw01_local_config_reset_arm
            - button.press: liw01_factory_reset_internal
          else:
            - lambda: |-
                ESP_LOGW("liw01_web_guard", "LOCAL CONFIG RESET refused: ARM switch is OFF");

  - platform: restart
    name: "Restart LIW-01"
    id: liw01_restart_button
    web_server:
      sorting_group_id: web_group_service
      sorting_weight: 90
    entity_category: diagnostic



