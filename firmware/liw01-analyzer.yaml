      sorting_weight: 20
    update_interval: never

  - platform: template
    name: "Local button last action"
    id: liw01_gpio5_last_action
    entity_category: diagnostic
    icon: "mdi:gesture-tap-hold"
    web_server:
      sorting_group_id: web_group_local_button
      sorting_weight: 30
    update_interval: never

  - platform: template
    name: "Startup recovery state"
    internal: true
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return { id(liw01_hw).get_startup_recovery_state_text() };

  - platform: template
    name: "Production state"
    internal: true
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return { id(liw01_hw).get_production_state_text() };

  - platform: template
    name: "System health"
    id: liw01_system_health
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 5
    entity_category: diagnostic
    icon: "mdi:check-decagram"
    update_interval: 5s
    lambda: |-
      if (!id(liw01_hw).get_counter_synced() ||
          !id(liw01_hw).get_v2_storage_ready() ||
          !id(liw01_hw).get_last_persist_ok() ||
          id(liw01_hw).get_v2_write_fault_count() != 0U ||
          id(liw01_hw).get_unsaved_delta() != 0ULL) {
        return { "FAULT" };
      }
      if (id(liw01_reset_arm).state ||
          id(liw01_local_config_reset_arm).state ||
          id(liw01_gpio5_factory_confirm_pending)) {
        return { "WARNING - SERVICE ARMED" };
      }
      return { "OK" };

