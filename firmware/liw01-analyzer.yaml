    entity_category: diagnostic
    icon: "mdi:shield-check"
    update_interval: 2s
    lambda: |-
      if (id(liw01_reset_arm).state)
        return { "COUNTER RESET ARMED - AUTO OFF 30s" };
      if (id(liw01_local_config_reset_arm).state)
        return { "LOCAL CONFIG RESET ARMED - AUTO OFF 30s" };
      if (id(liw01_gpio5_factory_confirm_pending))
        return { "LOCAL BUTTON FACTORY CONFIRM PENDING - SHORT PRESS WITHIN 10s" };
      return { "SAFE - ALL DESTRUCTIVE ACTIONS DISARMED" };

  - platform: template
