    update_interval: 10s
    lambda: |-
      return (float) id(liw01_hw).get_raw255_count();

  - platform: template
    name: "GPIO pad fault count"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return (float) id(liw01_hw).get_gpio_pad_fault_count();

  - platform: template
    name: "FRAM V2 sequence"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(liw01_hw).get_v2_sequence();

  - platform: template
    name: "FRAM V2 write count"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(liw01_hw).get_v2_write_count();

  - platform: template
    name: "FRAM V2 write faults"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(liw01_hw).get_v2_write_fault_count();

  - platform: template
    name: "FRAM V2 last persisted total"
    internal: true
    unit_of_measurement: "L"
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (double) id(liw01_hw).get_last_persisted_total();

  - platform: template
    name: "FRAM V2 unsaved delta"
    internal: true
    unit_of_measurement: "L"
    entity_category: diagnostic
    disabled_by_default: true
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return (double) id(liw01_hw).get_unsaved_delta();


  - platform: template
    name: "Local button last hold"
    id: liw01_gpio5_last_hold
    unit_of_measurement: "s"
    entity_category: diagnostic
    accuracy_decimals: 3
    web_server:
      sorting_group_id: web_group_local_button
      sorting_weight: 10
    update_interval: 2s
    lambda: |-
      return (double) id(liw01_gpio5_last_hold_ms) / 1000.0;

  - platform: wifi_signal
    name: "WiFi RSSI"
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 80
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    web_server:
      sorting_group_id: web_group_health
      sorting_weight: 90
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:

  # V0.5.0 final physical local-service button.
  # Electrical/input mode is the V0.4.2 RC2 FIELD-PASS mode.
  - platform: gpio
    id: liw01_gpio5_service_button
    internal: true
    use_interrupt: true
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: |-
          id(liw01_gpio5_press_started_ms) = millis();
    on_release:
      # First action only classifies and publishes. No service action occurs
      # until after release and after this classification completes.
      - lambda: |-
          const uint32_t hold_ms = millis() - id(liw01_gpio5_press_started_ms);
          id(liw01_gpio5_last_hold_ms) = hold_ms;

          const char *band = "IGNORED";
          uint8_t code = 0;
          if (hold_ms < 200U) {
            band = "IGNORED";
            code = 0;
          } else if (hold_ms < 4000U) {
            band = "SHORT";
            code = 1;
          } else if (hold_ms < 8000U) {
            band = "CONFIG";
            code = 2;
          } else if (hold_ms < 15000U) {
            band = "NETWORK";
            code = 3;
          } else {
            band = "FACTORY";
            code = 4;
          }

          id(liw01_gpio5_last_band_code) = code;
          id(liw01_gpio5_last_band).publish_state(band);
          ESP_LOGI("liw01_gpio5", "GPIO5 release hold=%u ms -> band=%s code=%u pending_factory=%s",
                   static_cast<unsigned int>(hold_ms), band, static_cast<unsigned int>(code),
                   id(liw01_gpio5_factory_confirm_pending) ? "YES" : "NO");

      # If FACTORY is already pending, ONLY a SHORT press may confirm it.
      # Any other band cancels the pending request and performs no other action.
      - if:
          condition:
            lambda: |-
              return id(liw01_gpio5_factory_confirm_pending);
          then:
            - if:
                condition:
                  lambda: |-
                    return id(liw01_gpio5_last_band_code) == 1;
                then:
                  - lambda: |-
                      id(liw01_gpio5_factory_confirm_pending) = false;
                  - if:
                      condition:
                        lambda: |-
                          return id(liw01_hw).get_v2_storage_ready() &&
                                 id(liw01_hw).get_last_persist_ok() &&
                                 id(liw01_hw).get_unsaved_delta() == 0ULL;
                      then:
                        - lambda: |-
                            id(liw01_gpio5_last_action).publish_state("FACTORY_CONFIRMED_RESETTING_LOCAL_CONFIG");
                            ESP_LOGW("liw01_gpio5",
                                     "FACTORY confirmed by second SHORT; local ESPHome preferences reset; external FRAM TOTAL kept");
                        - delay: 750ms
                        - button.press: liw01_factory_reset_internal
                      else:
                        - lambda: |-
                            id(liw01_gpio5_last_action).publish_state("FACTORY_REFUSED_FRAM_NOT_CLEAN");
                            ESP_LOGE("liw01_gpio5",
                                     "FACTORY confirmation refused: FRAM not ready/persist OK/clean");
                else:
                  - lambda: |-
                      id(liw01_gpio5_factory_confirm_pending) = false;
                      id(liw01_gpio5_last_action).publish_state("FACTORY_CONFIRM_CANCELLED");
                      ESP_LOGW("liw01_gpio5",
                               "FACTORY confirmation cancelled by non-SHORT follow-up; no other action executed");
          else:
            # Normal state-machine actions.
            - if:
                condition:
                  lambda: |-
                    return id(liw01_gpio5_last_band_code) == 0;
                then:
                  - lambda: |-
                      id(liw01_gpio5_last_action).publish_state("IGNORED");
            - if:
                condition:
                  lambda: |-
                    return id(liw01_gpio5_last_band_code) == 1;
                then:
                  - lambda: |-
                      id(liw01_gpio5_last_action).publish_state("SHORT_STATUS_ONLY");
                      ESP_LOGI("liw01_gpio5", "SHORT -> status only; no reboot/write");
            - if:
                condition:
                  lambda: |-
                    return id(liw01_gpio5_last_band_code) == 2;
                then:
                  - lambda: |-
                      id(liw01_gpio5_last_action).publish_state("CONFIG_RESTART");
                      ESP_LOGW("liw01_gpio5", "CONFIG -> normal ESP restart in 1.5 s");
                  - delay: 1500ms
                  - button.press: liw01_restart_button
            - if:
                condition:
                  lambda: |-
                    return id(liw01_gpio5_last_band_code) == 3;
                then:
                  - lambda: |-
                      id(liw01_gpio5_last_action).publish_state("NETWORK_WIFI_RECONNECT");
                      ESP_LOGW("liw01_gpio5", "NETWORK -> Wi-Fi OFF 5 s then ON; no ESP reboot");
                  - script.execute: liw01_gpio5_wifi_reconnect
            - if:
                condition:
                  lambda: |-
                    return id(liw01_gpio5_last_band_code) == 4;
                then:
                  - lambda: |-
                      id(liw01_gpio5_factory_confirm_pending) = true;
                      id(liw01_gpio5_last_action).publish_state("FACTORY_CONFIRM_PENDING_10S");
                      ESP_LOGW("liw01_gpio5",
                               "FACTORY long-hold -> ARM ONLY; second SHORT within 10 s required");
                  - script.execute: liw01_gpio5_factory_confirm_timeout

  - platform: template
